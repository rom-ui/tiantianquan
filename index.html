<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 小手机</title>

  <!-- PWA：添加到主屏幕 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/rom-ui/tupiandonut-assets@main/icons/fengmian.png">
  <meta name="application-name" content="甜甜圈">
  <meta name="apple-mobile-web-app-title" content="甜甜圈">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="dynamic-island"></div>

      <div class="screen">
        <!-- 状态栏 -->
        <div class="status-bar">
          <span class="status-time" id="statusTime">--:--</span>
          <span class="status-icons">
            <svg class="status-svg" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="1" y="14" width="4" height="6" rx="1" fill="currentColor"/>
              <rect x="7" y="10" width="4" height="10" rx="1" fill="currentColor"/>
              <rect x="13" y="6" width="4" height="14" rx="1" fill="currentColor"/>
              <rect x="19" y="2" width="4" height="18" rx="1" fill="currentColor" opacity="0.4"/>
            </svg>
            <svg class="status-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 8.5a14 14 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M5.5 12a9 9 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 15.5a4 4 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="19" r="1.4" fill="currentColor"/>
            </svg>
            <svg class="status-svg status-battery" viewBox="0 0 28 14" aria-hidden="true">
              <rect x="1" y="1" width="22" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <rect x="3.5" y="3.5" width="14" height="7" rx="1.5" fill="currentColor"/>
              <rect x="24.5" y="4.5" width="2.5" height="5" rx="1" fill="currentColor"/>
            </svg>
          </span>
        </div>

        <!-- 桌面区域 -->
        <div class="desktop">
          <div class="app-grid">
            <button class="app" type="button">
              <span class="app-icon">
                <img
                  src="https://cdn.jsdelivr.net/gh/rom-ui/tupiandonut-assets@main/icons/fengmian.png"
                  alt="甜甜圈"
                  onerror="this.style.display='none';"
                >
              </span>
              <span class="app-name">甜甜圈</span>
            </button>
            <button class="app" id="settingsEntry" type="button">
              <span class="app-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="app-name">设置</span>
            </button>
          </div>
        </div>

        <!-- 设置占位面板 -->
        <div class="settings-panel" id="settingsPanel" aria-hidden="true">
          <div class="settings-header">
            <span class="settings-title">设置</span>
            <button class="settings-close" id="settingsClose" type="button" aria-label="关闭设置">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="settings-body">
            <p>设置页占位</p>
            <p class="settings-sub">后续任务中将在这里补充具体功能</p>
          </div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
